# O tema pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[theme]
paddingTop = "0.0rem"     # espaço abaixo da barra do topo (valor entre aspas)
font = "sans serif"

[theme.light]
primaryColor = "#7541a0"
backgroundColor = "#faf7fc"
secondaryBackgroundColor = "#f0e8f5"
textColor = "#30233d"
borderColor = "#d9c8e5"

[theme.dark]
primaryColor = "#c69be8"
backgroundColor = "#19131f"
secondaryBackgroundColor = "#2c2035"
textColor = "#faf7fc"
borderColor = "#594166"
